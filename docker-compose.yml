services:
  api:
    build: .
    container_name: fastapi-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=${RATE_LIMIT:-1000}
      - WINDOW=${WINDOW:-3600}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: fastapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis-data: